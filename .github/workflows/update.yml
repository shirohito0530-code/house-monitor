name: Update house listings

on:
  workflow_dispatch:
  schedule:
    # 毎日、日本時間06:20に実行（UTC 21:20）
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-house-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show execution revision
        run: |
          echo "Execution revision:"
          git rev-parse HEAD
          git log -1 --oneline
          echo "Parser version:"
          grep -n "MAIN_PARSER_VERSION" scripts/main.py || true

      - name: Compile Python files
        run: python -m compileall -q scripts

      - name: Discover and fetch house listings
        run: python scripts/main.py

      # DB maintenance runs after main.py so all newly written data is compacted
      # before validation and commit. It deliberately does not fuzzy-merge houses.
      - name: Compact and validate JSON databases
        run: python scripts/db_maintenance.py

      - name: Validate output JSON and identity consistency
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          required = [
              Path("data/discovered_listings.json"),
              Path("data/houses.json"),
          ]

          def get_id(item):
              value = item.get("propertyId") or item.get("id")
              return str(value).strip() if value is not None else ""

          def load_db(path):
              if not path.exists():
                  raise SystemExit(f"ERROR: required file missing: {path}")
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  raise SystemExit(f"ERROR: {path} must be a JSON object")
              if not isinstance(data.get("properties"), list):
                  raise SystemExit(f"ERROR: {path}: properties must be a list")
              if not data.get("updatedAt"):
                  raise SystemExit(f"ERROR: {path}: updatedAt missing")
              seen = set()
              for i, item in enumerate(data["properties"]):
                  if not isinstance(item, dict):
                      raise SystemExit(f"ERROR: {path}: properties[{i}] is not an object")
                  pid = get_id(item)
                  if not pid:
                      raise SystemExit(f"ERROR: {path}: properties[{i}] has no propertyId/id")
                  if pid in seen:
                      raise SystemExit(f"ERROR: {path}: duplicate property ID: {pid}")
                  seen.add(pid)
                  if not item.get("sourceUrl"):
                      raise SystemExit(f"ERROR: {path}: properties[{i}] sourceUrl missing")
                  url = str(item["sourceUrl"])
                  if "suumo.jp" in url:
                      match = re.search(r"/(nc_\d+)(?:/|$)", url, re.I)
                      if match:
                          expected = "suumo:" + match.group(1).lower()
                          if pid != expected:
                              raise SystemExit(
                                  f"ERROR: {path}: propertyId/sourceUrl mismatch at properties[{i}]: "
                                  f"{pid} != {expected} ({url})"
                              )
              print(f"OK: {path} properties={len(data['properties'])} bytes={path.stat().st_size:,}")
              print(f"  updatedAt={data['updatedAt']}")
              print(f"  summary={data.get('summary', {})}")
              return data

          for path in required:
              load_db(path)

          observations_path = Path("data/listing_observations.json")
          if observations_path.exists():
              with observations_path.open(encoding="utf-8") as f:
                  obs = json.load(f)
              records = obs.get("observations", []) if isinstance(obs, dict) else obs
              if not isinstance(records, list):
                  raise SystemExit("ERROR: listing_observations.json observations must be a list")
              print(f"OK: {observations_path} observations={len(records)} bytes={observations_path.stat().st_size:,}")
          else:
              print("INFO: listing_observations.json not present; no history file to validate")
          PY

      - name: Display output summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("discovered_listings.json", "houses.json"):
              path = Path("data") / name
              with path.open(encoding="utf-8") as f:
                  data = json.load(f)
              print(f"===== {path} =====")
              print("updatedAt:", data.get("updatedAt"))
              print("schemaVersion:", data.get("schemaVersion"))
              print("parserVersion:", data.get("parserVersion"))
              print("properties:", len(data.get("properties", [])))
              print("summary:", data.get("summary", {}))
          PY

      - name: Show changed files
        run: |
          git status --short
          git diff --stat

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_listings.json data/houses.json
          if [ -f data/listing_observations.json ]; then
            git add data/listing_observations.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update house listings and compact database"
            git push
          fi
