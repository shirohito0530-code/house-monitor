name: Update house listings

on:
  workflow_dispatch:

  schedule:
    # 毎日、日本時間06:00に実行
    # UTC 21:00 = JST 06:00
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-house-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境を設定
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. 依存ライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SUUMO検索と詳細情報取得
      - name: Discover and fetch house listings
        run: |
          python scripts/main.py

      # 5. 出力ファイルを検証
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "data/discovered_listings.json"
          )

          if not path.exists():
              raise SystemExit(
                  "ERROR: data/discovered_listings.json was not created"
              )

          with path.open(
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: Output must be a JSON object"
              )

          if "updatedAt" not in data:
              raise SystemExit(
                  "ERROR: updatedAt is missing"
              )

          if "properties" not in data:
              raise SystemExit(
                  "ERROR: properties is missing"
              )

          if not isinstance(
              data["properties"],
              list
          ):
              raise SystemExit(
                  "ERROR: properties must be a list"
              )

          for index, property_data in enumerate(
              data["properties"]
          ):

              if not isinstance(
                  property_data,
                  dict
              ):
                  raise SystemExit(
                      f"ERROR: properties[{index}] must be an object"
                  )

              if "id" not in property_data:
                  raise SystemExit(
                      f"ERROR: properties[{index}].id is missing"
                  )

              if "sourceUrl" not in property_data:
                  raise SystemExit(
                      f"ERROR: properties[{index}].sourceUrl is missing"
                  )

          print("Output validation: OK")
          print(
              f"Updated at: {data['updatedAt']}"
          )
          print(
              f"Properties found: {len(data['properties'])}"
          )

          summary = data.get(
              "summary",
              {}
          )

          print(
              "Detail fetched:",
              summary.get(
                  "detailFetchedCount",
                  0
              )
          )
          PY

      # 6. 検索結果をログに表示
      - name: Display discovered listings
        run: |
          cat data/discovered_listings.json

      # 7. 変更をコミット・プッシュ
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/discovered_listings.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update discovered house listings"
            git push
          fi
