name: Update house data

on:
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update house data
        run: |
          python scripts/update_houses.py

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/houses.json

          if git diff --cached --quiet; then

            echo "No changes"

          else

            git commit -m "Auto update house data"

            git push

          fi
