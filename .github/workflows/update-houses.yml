
name: Update house listings

on:
  workflow_dispatch:

  schedule:
    # 毎日06:00 JST（21:00 UTC）
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-house-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリを取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python環境を準備
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. 依存ライブラリをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. SUUMO検索を実行
      - name: Discover SUUMO listings
        run: |
          python scripts/main.py

      # 5. 取得結果を確認
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/discovered_listings.json")

          if not path.exists():
              raise SystemExit(
                  "ERROR: discovered_listings.json was not created"
              )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          if not isinstance(data.get("properties"), list):
              raise SystemExit(
                  "ERROR: properties must be a list"
              )

          print(
              "Discovered listings:",
              len(data["properties"])
          )
          PY

      # 6. 取得結果をログに表示
      - name: Show output
        run: |
          cat data/discovered_listings.json

      # 7. データをコミット
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/discovered_listings.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update discovered house listings"
            git push
          fi
