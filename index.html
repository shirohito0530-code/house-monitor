<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>住宅モニター・価格履歴</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f1f5f9;color:#0f172a;margin:0}
header{background:#0f172a;color:#fff;padding:20px 16px}main{max-width:760px;margin:auto;padding:14px}
.panel{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
h1{font-size:20px;margin:0 0 5px}h2{font-size:16px}label{display:block;font-size:12px;color:#475569;margin-top:8px}
input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;box-sizing:border-box}
button{border:0;border-radius:10px;background:#2563eb;color:white;padding:11px 14px;font-size:13px;margin-top:10px}
.secondary{background:#475569}.danger{background:#b91c1c}.muted{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid #e2e8f0;border-radius:13px;padding:12px;margin-top:10px}.top{display:flex;justify-content:space-between;gap:8px}.price{font-weight:800;color:#047857}.tag{display:inline-block;background:#e2e8f0;border-radius:999px;padding:4px 8px;font-size:11px;margin:3px 3px 0 0}.warn{background:#fef3c7;color:#92400e}
</style>
</head>
<body>
<header><h1>住宅モニター</h1><div class="muted" style="color:#cbd5e1">iPhone対応・手動登録＋価格履歴保存版</div></header>
<main>
<section class="panel">
<h2>物件を登録・更新</h2>
<div class="grid">
<div><label>物件ID</label><input id="id" placeholder="例：suumo-001"></div>
<div><label>エリア</label><input id="area" placeholder="柏の葉 / おおたかの森"></div>
<div><div><label>物件名</label><input id="name"></div></div>
<div><label>現在価格（万円）</label><input id="price" type="number"></div>
<div><label>土地面積（㎡）</label><input id="land" type="number"></div>
<div><label>徒歩（分）</label><input id="walk" type="number"></div>
<div><label>築年</label><input id="year" type="number"></div>
<div><label>初回確認価格（万円）</label><input id="first" type="number"></div>
<div class="grid" style="grid-column:1/-1"><div><label>掲載開始/初回確認日</label><input id="listed" type="date"></div><div><label>情報確認日</label><input id="checked" type="date"></div></div>
</div>
<label>出典URL</label><input id="url" type="url" placeholder="https://...">
<label>メモ</label><textarea id="memo" rows="2" placeholder="学区、施工会社、擁壁、ハザード等"></textarea>
<button onclick="save()">登録・価格履歴を保存</button>
<button class="secondary" onclick="clearForm()">入力をクリア</button>
</section>
<section class="panel">
<h2>登録物件</h2>
<div class="grid">
<div><label>エリア絞り込み</label><select id="filterArea" onchange="render()"><option value="">すべて</option><option>柏の葉</option><option>おおたかの森</option></select></div>
<div><label>上限価格（万円）</label><input id="filterPrice" type="number" value="10000" onchange="render()"></div>
</div>
<div id="list"></div>
<button class="secondary" onclick="exportData()">データを書き出す（JSON）</button>
<label>バックアップ復元</label><input type="file" id="importFile" accept=".json" onchange="importData(event)">
</section>
<section class="panel">
<h2>使い方と制約</h2>
<p class="muted">各ポータルサイトで公開情報を確認し、物件情報を登録してください。同じ物件IDで再登録すると価格履歴が追加されます。データはこのブラウザのローカル保存領域に保存されます。ブラウザ消去・端末変更に備え、定期的にJSONバックアップを保存してください。</p>
</section>
</main>
<script>
let data=JSON.parse(localStorage.getItem("homes_tracker")||"[]");
const $=id=>document.getElementById(id);
function save(){
 const id=$("id").value.trim(); if(!id||!$("price").value){alert("物件IDと現在価格は必須です");return}
 const now=$("checked").value||new Date().toISOString().slice(0,10);
 let h=data.find(x=>x.id===id);
 const record={date:now,price:+$("price").value};
 if(!h){h={id,history:[]};data.push(h)}
 Object.assign(h,{area:$("area").value,name:$("name").value,land:+$("land").value||0,walk:+$("walk").value||0,year:+$("year").value||0,first:+$("first").value||record.price,listed:$("listed").value,url:$("url").value,memo:$("memo").value});
 if(!h.history.some(r=>r.date===record.date&&r.price===record.price))h.history.push(record);
 localStorage.setItem("homes_tracker",JSON.stringify(data));clearForm();render();
}
function clearForm(){["id","area","name","price","land","walk","year","first","listed","checked","url","memo"].forEach(k=>$(k).value="")}
function render(){
 const area=$("filterArea").value,max=+$("filterPrice").value||999999;
 const list=data.filter(h=>(!area||h.area===area)&&(!h.history.length||h.history[h.history.length-1].price<=max));
 $("list").innerHTML=list.length?list.map(h=>{
  const latest=h.history[h.history.length-1]||{price:h.first,date:""};
  const first=h.history[0]||latest,change=first.price?Math.round((latest.price-first.price)/first.price*1000)/10:0;
  const days=h.listed?Math.max(0,Math.floor((Date.now()-new Date(h.listed))/86400000)):"—";
  return `<article class="card"><div class="top"><b>${esc(h.area)} ${esc(h.name||h.id)}</b><span class="price">¥${latest.price.toLocaleString()}万</span></div>
  <span class="tag">${h.land||"—"}㎡</span><span class="tag">徒歩${h.walk||"—"}分</span><span class="tag">築${h.year||"—"}</span>
  ${change<0?`<span class="tag warn">価格変化 ${change}%</span>`:""}<span class="tag">掲載 ${days}日</span>
  <p class="muted">履歴：${h.history.map(r=>r.date+" ¥"+r.price.toLocaleString()+"万").join(" → ")}</p>
  <p class="muted">${esc(h.memo||"")}</p>${h.url?`<a href="${safeUrl(h.url)}" target="_blank">出典ページを開く</a>`:""}
  <button class="danger" onclick="removeHome('${h.id.replace(/'/g,"\\'")}')">削除</button></article>`}).join(""):'<p class="muted">登録物件はありません。</p>';
}
function removeHome(id){if(confirm("この物件を削除しますか？")){data=data.filter(h=>h.id!==id);localStorage.setItem("homes_tracker",JSON.stringify(data));render()}}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="house-monitor-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(!Array.isArray(incoming))throw Error();data=incoming;localStorage.setItem("homes_tracker",JSON.stringify(data));render();alert("復元しました")}catch{alert("JSON形式が不正です")}};r.readAsText(f)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u)?esc(u):"#"}
render();
</script>
</body>
</html>
