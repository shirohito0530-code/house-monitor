<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>House Monitor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    background: #f5f6f8;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 20px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 24px;
}

#updatedAt {
    font-size: 13px;
    opacity: 0.8;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 16px;
}

.filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 16px;
}

.filter {
    border: none;
    background: white;
    padding: 10px 16px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow:
        0 1px 4px rgba(0,0,0,0.08);
}

.filter.active {
    background: #1f2937;
    color: white;
}

.summary {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
    margin-bottom: 20px;
}

.summary-card {
    background: white;
    border-radius: 12px;
    padding: 14px;
    text-align: center;

    box-shadow:
        0 1px 5px rgba(0,0,0,0.08);
}

.summary-number {
    font-size: 24px;
    font-weight: bold;
}

.summary-label {
    font-size: 12px;
    color: #666;
}

.property {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}

.property-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.property-name {
    font-weight: bold;
    font-size: 17px;
}

.price {
    font-size: 22px;
    font-weight: bold;
    margin: 10px 0;
}

.meta {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    font-size: 14px;
}

.meta-item {
    background: #f7f7f7;
    padding: 8px;
    border-radius: 8px;
}

.flags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
}

.flag {
    background: #eef2ff;
    color: #3730a3;

    padding: 5px 8px;

    border-radius: 6px;

    font-size: 12px;
}

.price-down {
    color: #dc2626;
    font-weight: bold;
}

.price-up {
    color: #2563eb;
    font-weight: bold;
}

.property-footer {
    margin-top: 14px;
}

.property-footer a {
    display: inline-block;

    padding: 9px 14px;

    background: #1f2937;
    color: white;

    border-radius: 8px;

    text-decoration: none;

    font-size: 13px;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #777;
}

@media (min-width: 700px) {

    .meta {
        grid-template-columns:
            repeat(4, 1fr);
    }

}

</style>
</head>


<body>

<header>

    <h1>🏠 House Monitor</h1>

    <div id="updatedAt">
        データ読み込み中...
    </div>

</header>


<div class="container">

    <div class="filters">

        <button
            class="filter active"
            data-area="all">
            すべて
        </button>

        <button
            class="filter"
            data-area="柏の葉">
            柏の葉
        </button>

        <button
            class="filter"
            data-area="おおたかの森">
            おおたかの森
        </button>

    </div>


    <div class="summary">

        <div class="summary-card">

            <div
                id="newCount"
                class="summary-number">
                -
            </div>

            <div class="summary-label">
                新着
            </div>

        </div>


        <div class="summary-card">

            <div
                id="priceDownCount"
                class="summary-number">
                -
            </div>

            <div class="summary-label">
                値下げ
            </div>

        </div>


        <div class="summary-card">

            <div
                id="longCount"
                class="summary-number">
                -
            </div>

            <div class="summary-label">
                長期掲載
            </div>

        </div>

    </div>


    <div id="properties"></div>

</div>


<script>

let properties = [];

let currentArea = "all";


async function loadData() {

    try {

        const response =
            await fetch(
                "data/houses.json?" +
                Date.now()
            );

        if (!response.ok) {

            throw new Error(
                "データ取得失敗"
            );

        }

        const data =
            await response.json();

        properties =
            data.properties || [];

        updateHeader(
            data.updatedAt
        );

        render();

    } catch (error) {

        console.error(error);

        document
            .getElementById(
                "properties"
            )
            .innerHTML = `
                <div class="empty">
                    データを読み込めませんでした。
                </div>
            `;

    }

}


function updateHeader(
    updatedAt
) {

    if (!updatedAt) {

        document
            .getElementById(
                "updatedAt"
            )
            .textContent =
                "データ更新日時：未設定";

        return;
    }

    const date =
        new Date(updatedAt);

    document
        .getElementById(
            "updatedAt"
        )
        .textContent =
        "最終更新：" +
        date.toLocaleString(
            "ja-JP"
        );

}


function render() {

    let filtered =
        properties;

    if (currentArea !== "all") {

        filtered =
            properties.filter(
                p =>
                p.area === currentArea
            );

    }

    updateSummary(
        filtered
    );

    renderProperties(
        filtered
    );

}


function updateSummary(
    list
) {

    const newCount =
        list.filter(
            p =>
            (p.flags || [])
                .includes("新着")
        ).length;

    const priceDownCount =
        list.filter(
            p =>
            (p.flags || [])
                .includes("値下げ")
        ).length;

    const longCount =
        list.filter(
            p =>
            (p.flags || [])
                .includes("長期掲載")
        ).length;


    document
        .getElementById(
            "newCount"
        )
        .textContent =
        newCount;


    document
        .getElementById(
            "priceDownCount"
        )
        .textContent =
        priceDownCount;


    document
        .getElementById(
            "longCount"
        )
        .textContent =
        longCount;

}


function renderProperties(
    list
) {

    const container =
        document.getElementById(
            "properties"
        );

    if (!list.length) {

        container.innerHTML = `
            <div class="empty">
                条件に一致する物件はありません。
            </div>
        `;

        return;
    }


    // 新着・値下げ・掲載日数を考慮して表示
    list.sort(
        (a, b) => {

            const aNew =
                (a.flags || [])
                    .includes("新着")
                    ? 1 : 0;

            const bNew =
                (b.flags || [])
                    .includes("新着")
                    ? 1 : 0;

            if (aNew !== bNew) {
                return bNew - aNew;
            }

            const aDown =
                (a.flags || [])
                    .includes("値下げ")
                    ? 1 : 0;

            const bDown =
                (b.flags || [])
                    .includes("値下げ")
                    ? 1 : 0;

            return bDown - aDown;

        }
    );


    container.innerHTML =
        list.map(
            createPropertyCard
        ).join("");

}


function createPropertyCard(
    p
) {

    const flags =
        (p.flags || [])
            .map(
                flag =>
                `<span class="flag">
                    ${flag}
                </span>`
            )
            .join("");


    let priceChange = "";


    if (
        p.priceChange !== undefined &&
        p.priceChange < 0
    ) {

        priceChange = `
            <div class="price-down">
                ↓ ${Math.abs(
                    p.priceChange
                )}万円
                値下げ
            </div>
        `;

    }


    if (
        p.priceChange !== undefined &&
        p.priceChange > 0
    ) {

        priceChange = `
            <div class="price-up">
                ↑ ${p.priceChange}万円
            </div>
        `;

    }


    const url =
        p.url || "";


    return `

        <div class="property">

            <div class="property-header">

                <div>

                    <div class="property-name">
                        ${escapeHtml(
                            p.name || "物件"
                        )}
                    </div>

                    <div>
                        ${escapeHtml(
                            p.area || ""
                        )}
                    </div>

                </div>

            </div>


            <div class="price">

                ${formatPrice(
                    p.price
                )}万円

            </div>


            ${priceChange}


            <div class="meta">

                <div class="meta-item">
                    土地<br>
                    <strong>
                        ${p.land || "-"}㎡
                    </strong>
                </div>

                <div class="meta-item">
                    建物<br>
                    <strong>
                        ${p.building || "-"}㎡
                    </strong>
                </div>

                <div class="meta-item">
                    徒歩<br>
                    <strong>
                        ${p.walk || "-"}分
                    </strong>
                </div>

                <div class="meta-item">
                    築年<br>
                    <strong>
                        ${p.year || "-"}年
                    </strong>
                </div>

            </div>


            <div class="flags">

                ${flags}

            </div>


            <div class="property-footer">

                ${
                    url
                    ?
                    `<a
                        href="${escapeHtml(url)}"
                        target="_blank"
                        rel="noopener">
                        物件ページを開く
                    </a>`
                    :
                    ""
                }

            </div>

        </div>

    `;

}


function formatPrice(
    price
) {

    if (
        price === undefined ||
        price === null
    ) {
        return "-";
    }

    return Number(
        price
    ).toLocaleString(
        "ja-JP"
    );

}


function escapeHtml(
    value
) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


document
    .querySelectorAll(".filter")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".filter"
                        )
                        .forEach(
                            b =>
                            b.classList
                                .remove(
                                    "active"
                                )
                        );

                    button.classList
                        .add("active");

                    currentArea =
                        button.dataset.area;

                    render();

                }
            );

        }
    );


loadData();

</script>

</body>
</html>
